apiVersion: apps/v1
kind: Deployment
metadata:
  name: amazonapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: amazonapp
  template:
    metadata:
      labels:
        app: amazonapp
    spec:
      containers:
        - name: amazonapp-container
          image: registry.gitlab.com/mexxy-lab/npmproject:1
          resources:
            limits:
              memory: 128Mi
              cpu: 500m
              ephemeral-storage: "1Gi"
            requests:
              memory: 64Mi
              cpu: 250m
              ephemeral-storage: "512Mi"
          ports:
            - containerPort: 80
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: gitlab-registry-secret

---
apiVersion: v1
kind: Service
metadata:
  name: nodejsapp-service
spec:
  selector:
    app: nodejsapp
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
    nodePort: 30380
  type: LoadBalancer

