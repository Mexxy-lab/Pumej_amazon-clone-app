# Unique project identifier in SonarQube.
sonar.projectKey=pumej-amazon-clone-app

# Display name shown in the SonarQube dashboard.
sonar.projectName=Pumej Amazon Clone App

# Initial analysis scope: scan source files throughout the repository.
sonar.sources=.

# Exclude dependencies, generated files, build output, and Git metadata.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.git/**,**/vendor/**

# Use UTF-8 when analyzing source files.
sonar.sourceEncoding=UTF-8